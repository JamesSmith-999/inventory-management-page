<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的产品库存管理</title>
<style>
:root{--ink:#172033;--muted:#6b7280;--line:#e6e8ee;--bg:#f6f7fb;--card:#fff;--a:#5b5ce2;--green:#198c5c;--red:#d64d5d;--amber:#b6780c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:1240px;margin:auto;padding:28px 22px 48px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.eyebrow{color:var(--a);font-weight:700;font-size:13px;letter-spacing:.08em}.title{font-size:32px;line-height:1.15;margin:7px 0 9px}.sub{color:var(--muted);margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:11px 15px;border-radius:11px;font-weight:700}.primary{background:var(--a);color:#fff}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 18px}.stat-label{font-size:13px;color:var(--muted)}.stat-value{font-size:27px;font-weight:800;margin-top:7px}.stat-note{font-size:12px;color:var(--muted);margin-top:5px}.layout{display:grid;grid-template-columns:1fr 330px;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-title{font-weight:800}.tools{display:flex;gap:9px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}.search{flex:1;min-width:190px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}.select,.input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:14px 20px;border-bottom:1px solid #f0f1f4;font-size:14px;white-space:nowrap}.table th{font-size:12px;color:var(--muted);background:#fafafe}.product{display:flex;align-items:center;gap:11px}.thumb{width:38px;height:38px;border-radius:10px;background:#e9e9ff;display:grid;place-items:center;font-weight:800;color:var(--a)}.product-name{font-weight:700}.sku{font-size:12px;color:var(--muted);margin-top:2px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.live{background:#e9f8f0;color:var(--green)}.offline{background:#f0f1f5;color:#687083}.low{color:var(--amber)}.stock-control{display:inline-flex;align-items:center;gap:7px}.stock-step{width:25px;height:25px;padding:0;border-radius:7px;background:#f1f1fb;color:var(--a);font-weight:800}.stock-number{min-width:24px;text-align:center}.row-actions{display:flex;gap:7px}.icon-btn{padding:7px 9px;border-radius:8px;background:#f4f4fb;color:var(--a);font-size:12px;font-weight:700}.danger{color:var(--red);background:#fff0f2}.empty{padding:46px 20px;text-align:center;color:var(--muted)}.side{padding:20px}.side h3{margin:0 0 4px}.side p{color:var(--muted);font-size:13px;margin:0 0 18px}.form{display:grid;gap:12px}.label{font-size:12px;font-weight:700;color:#4b5563;margin-bottom:5px;display:block}.input{width:100%}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#4b5563}.tip{margin-top:18px;background:#f7f7ff;color:#5d5c9d;border-radius:12px;padding:12px;font-size:12px;line-height:1.6}.footer{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}@media(max-width:860px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.top{flex-direction:column}}
</style></head><body><div class="shell">
<header class="top"><div><div class="eyebrow">INVENTORY CONTROL</div><h1 class="title">我的产品库存管理</h1><p class="sub">一眼查看库存状态，快速上架、下架和维护产品信息。</p></div><div class="actions"><button class="btn ghost" id="templateBtn">下载模板</button><button class="btn ghost" id="importBtn">批量导入</button><input id="importFile" type="file" accept=".csv,text/csv" hidden><button class="btn ghost" id="exportBtn">导出清单</button><button class="btn primary" id="addTopBtn">＋ 添加产品</button></div></header>
<section class="stats"><div class="stat"><div class="stat-label">产品总数</div><div class="stat-value" id="totalCount">0</div><div class="stat-note">当前库存档案</div></div><div class="stat"><div class="stat-label">已上架</div><div class="stat-value" id="liveCount">0</div><div class="stat-note">正在销售</div></div><div class="stat"><div class="stat-label">库存预警</div><div class="stat-value" id="lowCount">0</div><div class="stat-note">库存 ≤ 5 件</div></div><div class="stat"><div class="stat-label">库存总量</div><div class="stat-value" id="stockCount">0</div><div class="stat-note">所有产品合计</div></div></section>
<div class="layout"><section class="panel"><div class="panel-head"><div class="panel-title">产品清单</div><div id="updated" class="stat-note"></div></div><div class="tools"><input class="search" id="search" placeholder="搜索产品名称或 SKU"><select class="select" id="statusFilter"><option value="all">全部状态</option><option value="live">已上架</option><option value="offline">已下架</option></select><select class="select" id="stockFilter"><option value="all">全部库存</option><option value="low">库存预警</option><option value="zero">无库存</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>产品</th><th>售价</th><th>成本价</th><th>库存</th><th>入库日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" hidden>还没有匹配的产品。可以从右侧添加一条库存记录。</div></div></section>
<aside class="panel side"><h3 id="formTitle">添加产品</h3><p>填写后保存，产品会立即出现在清单中。</p><form class="form" id="productForm"><div><label class="label">产品名称</label><input class="input" name="name" required placeholder="例如：B5 修护精华"></div><div><label class="label">SKU / 编号</label><input class="input" name="sku" placeholder="例如：B5-001"></div><div class="form-row"><div><label class="label">售价（元）</label><input class="input" name="price" type="number" min="0" step=".01" required placeholder="0"></div><div><label class="label">成本价（元）</label><input class="input" name="cost" type="number" min="0" step=".01" required placeholder="0"></div></div><div class="form-row"><div><label class="label">库存数量</label><input class="input" name="stock" type="number" min="0" required placeholder="0"></div><div><label class="label">入库日期</label><input class="input" name="date" type="date"></div></div><label class="check"><input type="checkbox" name="live" checked> 保存后直接上架</label><div class="actions"><button class="btn primary" type="submit" id="saveBtn">保存产品</button><button class="btn ghost" type="button" id="cancelBtn" hidden>取消编辑</button></div></form><div class="tip">提示：点击清单中的“上架 / 下架”即可切换销售状态。数据保存在当前浏览器中，刷新页面也会保留。</div></aside></div><div class="footer">轻量库存工具 · 支持本地保存与 CSV 导出</div></div>
<script>
var seed=[{id:1,name:"配方师告白面霜",sku:"FM-001",price:299,cost:120,stock:30,date:"2026-10-01",live:true},{id:2,name:"B5 修护精华",sku:"B5-001",price:199,cost:78,stock:40,date:"2026-10-03",live:true},{id:3,name:"祛痘精华",sku:"AC-001",price:169,cost:65,stock:40,date:"2026-10-05",live:false},{id:4,name:"五味子面膜",sku:"WZ-001",price:99,cost:35,stock:40,date:"2026-10-08",live:true},{id:5,name:"千肽面膜",sku:"QP-001",price:129,cost:48,stock:20,date:"2026-10-10",live:false}];
var products=JSON.parse(localStorage.getItem("inventory-products")||"null")||seed, editingId=null;
function $(id){return document.getElementById(id)} function save(){localStorage.setItem("inventory-products",JSON.stringify(products));$("updated").textContent="刚刚更新"}
function render(){
var q=$("search").value.trim().toLowerCase(),sf=$("statusFilter").value,kf=$("stockFilter").value,arr=products.filter(function(p){return(!q||p.name.toLowerCase().indexOf(q)>-1||(p.sku||"").toLowerCase().indexOf(q)>-1)&&(sf==="all"||(sf==="live"&&p.live)||(sf==="offline"&&!p.live))&&(kf==="all"||(kf==="low"&&p.stock<=5)||(kf==="zero"&&p.stock===0))});
$("tbody").innerHTML=arr.map(function(p){return '<tr><td><div class="product"><div class="thumb">'+p.name.slice(0,1)+'</div><div><div class="product-name">'+p.name+'</div><div class="sku">'+(p.sku||"未填写 SKU")+'</div></div></div></td><td>¥'+Number(p.price).toFixed(2)+'</td><td>¥'+Number(p.cost||0).toFixed(2)+'</td><td class="'+(p.stock<=5?"low":"")+'"><div class="stock-control"><button class="stock-step" data-action="dec" data-id="'+p.id+'" aria-label="库存减一">−</button><span class="stock-number">'+p.stock+'</span><button class="stock-step" data-action="inc" data-id="'+p.id+'" aria-label="库存加一">＋</button></div></td><td>'+(p.date||"—")+'</td><td><span class="pill '+(p.live?"live":"offline")+'">● '+(p.live?"已上架":"已下架")+'</span></td><td><div class="row-actions"><button class="icon-btn" data-action="toggle" data-id="'+p.id+'">'+(p.live?"下架":"上架")+'</button><button class="icon-btn" data-action="edit" data-id="'+p.id+'">编辑</button><button class="icon-btn danger" data-action="delete" data-id="'+p.id+'">删除</button></div></td></tr>'}).join("");
$("empty").hidden=arr.length>0;$("totalCount").textContent=products.length;$("liveCount").textContent=products.filter(function(p){return p.live}).length;$("lowCount").textContent=products.filter(function(p){return p.stock<=5}).length;$("stockCount").textContent=products.reduce(function(a,p){return a+Number(p.stock)},0)}
function resetForm(){editingId=null;$("productForm").reset();$("productForm").live.checked=true;$("formTitle").textContent="添加产品";$("saveBtn").textContent="保存产品";$("cancelBtn").hidden=true}
$("productForm").addEventListener("submit",function(e){e.preventDefault();var f=new FormData(e.target),item={name:f.get("name").trim(),sku:f.get("sku").trim(),price:Number(f.get("price")),cost:Number(f.get("cost")||0),stock:Number(f.get("stock")),date:f.get("date")||"",live:f.get("live")==="on"};if(editingId){products=products.map(function(p){return p.id===editingId?Object.assign({},p,item):p})}else products.push(Object.assign({id:Date.now()},item));save();render();resetForm()});
$("tbody").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var id=Number(b.dataset.id),p=products.find(function(x){return x.id===id});if(b.dataset.action==="inc"){p.stock=Number(p.stock||0)+1;save();render()}if(b.dataset.action==="dec"){p.stock=Math.max(0,Number(p.stock||0)-1);save();render()}if(b.dataset.action==="toggle"){p.live=!p.live;save();render()}if(b.dataset.action==="delete"&&confirm("确定删除这个产品吗？")){products=products.filter(function(x){return x.id!==id});save();render()}if(b.dataset.action==="edit"){editingId=id;$("productForm").name.value=p.name;$("productForm").sku.value=p.sku;$("productForm").price.value=p.price;$("productForm").cost.value=p.cost||0;$("productForm").stock.value=p.stock;$("productForm").date.value=p.date||"";$("productForm").live.checked=p.live;$("formTitle").textContent="编辑产品";$("saveBtn").textContent="保存修改";$("cancelBtn").hidden=false;window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}});
$("cancelBtn").onclick=resetForm;$("addTopBtn").onclick=function(){resetForm();$("productForm").name.focus();window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})};["search","statusFilter","stockFilter"].forEach(function(id){$(id).addEventListener("input",render)});$("exportBtn").onclick=function(){var rows=[["产品名称","SKU","售价","成本价","库存","入库日期","状态"]].concat(products.map(function(p){return[p.name,p.sku,p.price,p.cost||0,p.stock,p.date||"",p.live?"已上架":"已下架"]}));var csv="\ufeff"+rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(",")}).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="产品库存清单.csv";a.click();URL.revokeObjectURL(a.href)};$("templateBtn").onclick=function(){var csv="\ufeff产品名称,SKU,售价,成本价,库存,入库日期,状态\n示例产品,SKU-001,99,35,10,2026-11-14,已上架",a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="库存批量导入模板.csv";a.click();URL.revokeObjectURL(a.href)};$("importBtn").onclick=function(){$("importFile").click()};$("importFile").addEventListener("change",function(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){var lines=r.result.replace(/^\ufeff/,"").split(/\r?\n/).filter(function(x){return x.trim()});var imported=lines.slice(1).map(function(line){var a=line.split(",");return{name:a[0]||"未命名产品",sku:a[1]||"",price:Number(a[2]||0),cost:Number(a[3]||0),stock:Number(a[4]||0),date:a[5]||"",live:!(a[6]&&a[6].indexOf("下架")>-1)}});products=products.concat(imported.map(function(x){return Object.assign({id:Date.now()+Math.random()},x)}));save();render();alert("已导入 "+imported.length+" 条产品");e.target.value=""};r.readAsText(file,"utf-8")});render();
</script></body></html>
